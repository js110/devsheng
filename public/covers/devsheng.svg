<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- browser frame -->
  <rect x="50" y="60" width="700" height="300" rx="10" fill="none" stroke="#00ff88" stroke-width="2" filter="url(#glow1)"/>
  <line x1="50" y1="100" x2="750" y2="100" stroke="#333" stroke-width="1"/>
  <circle cx="76" cy="80" r="5" fill="#00ffff" opacity="0.7"/>
  <circle cx="96" cy="80" r="5" fill="#00ff88" opacity="0.7"/>
  <circle cx="116" cy="80" r="5" fill="#888" opacity="0.6"/>
  <rect x="140" y="69" width="330" height="22" rx="4" fill="#1a1a1a"/>
  <text x="152" y="85" fill="#888" font-family="monospace" font-size="12">https://jiangsheng.icu</text>
  <!-- hero terminal -->
  <text x="80" y="150" fill="#888" font-family="monospace" font-size="13"><tspan fill="#00ff88">$</tspan> whoami</text>
  <text x="80" y="182" fill="#e8eded" font-family="monospace" font-size="19" font-weight="bold"><tspan fill="#00ff88">&lt;</tspan><tspan fill="#00ffff">Projects</tspan><tspan fill="#00ff88"> /&gt;</tspan></text>
  <text x="80" y="212" fill="#888" font-family="monospace" font-size="12">$ ls -la ./projects/</text>
  <text x="80" y="234" fill="#00ff88" font-family="monospace" font-size="12">drwxr-xr-x  blog/</text>
  <text x="80" y="254" fill="#00ff88" font-family="monospace" font-size="12">-rw-r--r--  resume.json</text>
  <text x="80" y="286" fill="#888" font-family="monospace" font-size="12">$ echo "Keep hacking, keep learning"<tspan fill="#00ffff">▊</tspan></text>
  <!-- blog card -->
  <rect x="470" y="130" width="250" height="180" rx="8" fill="none" stroke="#00ffff" stroke-width="2" filter="url(#glow1)"/>
  <text x="490" y="162" fill="#00ffff" font-family="monospace" font-size="13" opacity="0.85">~/blog</text>
  <line x1="490" y1="175" x2="700" y2="175" stroke="#333" stroke-width="1"/>
  <text x="490" y="200" fill="#888" font-family="monospace" font-size="11">2026-11-11</text>
  <text x="580" y="200" fill="#e8eded" font-family="monospace" font-size="11">给我妹妹的一些建议</text>
  <text x="490" y="224" fill="#888" font-family="monospace" font-size="11">2026-10-15</text>
  <text x="580" y="224" fill="#e8eded" font-family="monospace" font-size="11">关于坚持和自学</text>
  <text x="490" y="248" fill="#888" font-family="monospace" font-size="11">2026-09-07</text>
  <text x="580" y="248" fill="#e8eded" font-family="monospace" font-size="11">住我隔壁的大哥</text>
  <text x="490" y="284" fill="#00ff88" font-family="monospace" font-size="11">$ vercel --prod ✓</text>
  <text x="400" y="410" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="24" font-weight="bold" filter="url(#glow1)">DevSheng</text>
</svg>
